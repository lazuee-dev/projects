<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to our Portfolio</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/splash.css">
  <style>
    .fade-down {
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .show {
      opacity: 1 !important;
    }
  </style>
</head>

<body>
  <span class="sr-only" href="https://github.com/lazuee">Lazuee</span>
  <div class="bg"></div>
  <div class="splash">
    <div>
      <div class="content">
        <h1>Together, We Grow</h1>
        <p>Where teamwork meets friendship</p>
      </div>
    </div>
  </div>
  <script>
    const gotoHome = () => window.location.replace('home.html');
    if (sessionStorage.getItem('visit')) gotoHome();
    else {
      document.addEventListener('DOMContentLoaded', () => {
        const splash = document.querySelector('.splash');
        splash.classList.add('show');
        setTimeout(() => {
          splash.classList.remove('show');
          splash.classList.add('fade-down');
          setTimeout(gotoHome, 500);
        }, 5_000);
      });
    }
  </script>
</body>

</html>
